<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#bf5c0f"/>
    </linearGradient>
    <!-- glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Soft orange glow behind asterisk -->
  <circle cx="64" cy="52" r="30" fill="#e07820" opacity="0.18" filter="url(#glow)"/>

  <!-- Claude asterisk — large, centered -->
  <g filter="url(#glow)">
    <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(0 64 52)"/>
  <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(30 64 52)"/>
  <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(60 64 52)"/>
  <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(90 64 52)"/>
  <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(120 64 52)"/>
  <rect x="60" y="19" width="8" height="66" rx="4"
        fill="url(#claude)" transform="rotate(150 64 52)"/>
  </g>

  <!-- Bottom label: blue "RTL" bold text -->
  <text x="64" y="118" font-family="'Arial Black', Arial, sans-serif" font-size="22"
        font-weight="900" fill="#4da6ff" text-anchor="middle" letter-spacing="3">RTL</text>
</svg>